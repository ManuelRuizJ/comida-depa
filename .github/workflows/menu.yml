name: Menú semanal

on:
  schedule:
    # Viernes 14:00 UTC = 8:00 AM Puebla
    - cron: "0 14 * * 5"
  workflow_dispatch: {}

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: node scripts/menu_semanal.mjs
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          APP_URL: https://comida-depa-rh8t.vercel.app