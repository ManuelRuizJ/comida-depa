name: Cierre de semana

on:
  schedule:
    # Sábado 06:00 UTC = medianoche del viernes en Puebla,
    # antes del correo de compras (sábado 15:00 UTC).
    - cron: "0 6 * * 6"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  cerrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --omit=dev
      - run: node scripts/nueva_semana.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
