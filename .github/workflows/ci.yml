name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
        env:
          # El build no consulta Supabase (todas las páginas son dinámicas),
          # pero el cliente necesita una URL con formato válido.
          SUPABASE_URL: https://ejemplo.supabase.co
          SUPABASE_ANON_KEY: ci
          APP_PASSWORD: ci
